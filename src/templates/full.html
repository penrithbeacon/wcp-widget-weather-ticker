<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Detail</title>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --surface2:#1c2128;
          --border:#30363d; --text:#e6edf3; --muted:#8b949e;
          --accent:#f0883e; --green:#3fb950; --radius:8px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--surface); border:1px solid var(--border);
          border-radius:var(--radius); padding:28px 32px; width:360px; }
  .location { font-size:16px; font-weight:600; margin-bottom:4px; }
  .datetime { font-size:12px; color:var(--muted); margin-bottom:20px; }
  .main { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .weather-icon { font-size:48px; line-height:1; }
  .temp { font-size:40px; font-weight:700; color:var(--accent); }
  .desc { font-size:14px; color:var(--muted); margin-top:2px; }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .stat { background:var(--surface2); border-radius:6px; padding:10px;
          text-align:center; }
  .stat-val { font-size:16px; font-weight:600; }
  .stat-label { font-size:11px; color:var(--muted); margin-top:2px; }
  .no-config { text-align:center; color:var(--muted); font-size:13px; padding:20px; }
  .btn-row { display:flex; gap:8px; margin-top:20px; justify-content:center; }
  button { background:var(--surface2); border:1px solid var(--border);
           border-radius:6px; color:var(--text); font-family:inherit;
           font-size:12px; padding:7px 14px; cursor:pointer; }
  button:hover { background:var(--surface); }
</style>
</head>
<body>
<div class="card" id="weather-card">
  <p class="no-config">Loading…</p>
</div>
<script>
  const WCP_ORCHESTRATION_ID = "{{ wcp_orchestration_id|default('', true) }}";
  const WCP_APPLICATION_ID   = "{{ wcp_application_id|default('', true) }}";
  function wcpFetch(url, opts) {
    opts = opts || {};
    const extra = {};
    if (WCP_ORCHESTRATION_ID) extra['Wcp-Orchestration-Id'] = WCP_ORCHESTRATION_ID;
    if (WCP_APPLICATION_ID)   extra['Wcp-Application-Id']   = WCP_APPLICATION_ID;
    opts.headers = Object.assign({}, opts.headers || {}, extra);
    return fetch(url, opts);
  }
  async function load() {
    const card = document.getElementById('weather-card');
    try {
      const r = await fetch('/widget/api/weather');
      const d = await r.json();
      if (d.error === 'no_location') {
        card.innerHTML = '<p class="no-config">⚙ No location configured.<br>Open Settings → Masthead Tickers to set up.</p>';
        return;
      }
      card.innerHTML = `
        <div class="location">📍 ${d.location}</div>
        <div class="datetime">📅 ${d.date} &nbsp;·&nbsp; 🕐 ${d.time}</div>
        <div class="main">
          <div class="weather-icon">${d.icon}</div>
          <div>
            <div class="temp">${d.temperature}</div>
            <div class="desc">${d.description}</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-val">💨 ${d.wind}</div><div class="stat-label">Wind</div></div>
          <div class="stat"><div class="stat-val">💧 ${d.humidity}</div><div class="stat-label">Humidity</div></div>
          <div class="stat"><div class="stat-val">☀ UV ${d.uv}</div><div class="stat-label">UV Index</div></div>
        </div>
        <div class="btn-row">
          <button onclick="openFullWindow()">⬡ Full Screen</button>
          <button onclick="openNewTab()">⊞ New Tab</button>
        </div>`;
    } catch (e) {
      card.innerHTML = `<p class="no-config">Error: ${e.message}</p>`;
    }
  }

  function openFullWindow() {
    window.parent.postMessage({
      type: 'wcp:open-window', url: window.location.origin + '/widget/full',
      window: { width: 420, height: 380 }
    }, '*');
  }
  function openNewTab() {
    window.parent.postMessage({
      type: 'wcp:open-tab', url: window.location.origin + '/widget/full',
      title: 'Weather', icon: window.location.origin + '/widget/icon.svg', persist: false
    }, '*');
  }

  load();
</script>
</body>
</html>
