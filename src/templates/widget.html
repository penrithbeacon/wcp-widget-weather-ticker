<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Ticker</title>
<script type="application/ld+json">{{ jsonld|safe }}</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden;
         display:flex; align-items:center; height:100vh; }
  .mq-wrap { overflow:hidden; width:100%; }
  .mq-track { display:inline-flex; white-space:nowrap;
              animation: scroll 40s linear infinite; }
  .mq-track:hover { animation-play-state:paused; }
  .mq-item { color:#3fb950; font-size:14px; font-weight:500;
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
             padding-right:120px; letter-spacing:.02em; }
  .no-config { color:#8b949e; font-size:12px;
               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
               padding:0 20px; }
  @keyframes scroll {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }
</style>
</head>
<body>
<div class="mq-wrap" id="ticker-wrap">
  <p class="no-config">⚙ Weather Ticker — open Settings to configure a location.</p>
</div>
<script>
  const WCP_INSTANCE_ID    = "{{ wcp_instance_id }}";
  const WCP_ORCHESTRATION_ID = "{{ wcp_orchestration_id|default('', true) }}";
  const WCP_APPLICATION_ID   = "{{ wcp_application_id|default('', true) }}";
  function wcpFetch(url, opts) {
    opts = opts || {};
    const extra = {};
    if (WCP_ORCHESTRATION_ID) extra['Wcp-Orchestration-Id'] = WCP_ORCHESTRATION_ID;
    if (WCP_APPLICATION_ID)   extra['Wcp-Application-Id']   = WCP_APPLICATION_ID;
    opts.headers = Object.assign({}, opts.headers || {}, extra);
    return fetch(url, opts);
  }
  const WCP_CONFIG = {{ config | tojson }};
  const REFRESH_MS = {{ config.get('refresh_interval', 900) * 1000 }};

  async function updateTicker() {
    try {
      const loc = WCP_CONFIG.location;
      const params = loc && loc.latitude
        ? `?lat=${loc.latitude}&lon=${loc.longitude}&units=${WCP_CONFIG.units || 'celsius'}&loc=${encodeURIComponent(loc.name + ', ' + (loc.admin1 || '') + ', ' + (loc.country_code || ''))}`
        : '';
      const r = await fetch('/widget/api/weather' + params);
      const d = await r.json();
      if (d.error) return;
      const text = `📍 ${d.location} 📅 ${d.date} 🕐 ${d.time} ${d.icon} ${d.temperature}  ${d.description} 💨 ${d.wind} 💧 ${d.humidity} UV ${d.uv}`;
      const wrap = document.getElementById('ticker-wrap');
      wrap.innerHTML = `<div class="mq-track"><span class="mq-item">${text}</span><span class="mq-item">${text}</span></div>`;
    } catch (e) { console.error(e); }
  }

  {% if config.get('location') %}
  updateTicker();
  setInterval(updateTicker, REFRESH_MS);
  {% endif %}
  window.parent?.postMessage({ type: 'wcp:ready' }, '*');
  window.parent?.postMessage({ type: 'wcp:request-theme' }, '*');
  window.addEventListener('message', e => {
    const vars = (e.data?.type === 'wcp:context' && e.data.theme) ? e.data.theme
               : (e.data?.type === 'wcp:theme' && e.data.vars) ? e.data.vars : null;
    if (vars) for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
  });
  // Read theme from URL fragment (standalone window opened by host via wcp:open-window)
  if (window.location.hash.startsWith('#wcp-theme=')) {
    try {
      const _fvars = JSON.parse(atob(window.location.hash.slice(11)));
      for (const [k, v] of Object.entries(_fvars)) document.documentElement.style.setProperty(k, v);
    } catch {}
  }
</script>
</body>
</html>
